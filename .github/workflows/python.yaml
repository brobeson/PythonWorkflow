# cspell:words doctree doctrees nitpicky
name: Python
on:
  workflow_call:

jobs:
  staticAnalysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: pip3 install mypy pylint sphinx
      - name: Clone the repository
        uses: actions/checkout@v4
      - name: Check formatting
        uses: psf/black@stable
        with:
          options: "--check"
      - name: Run PyLint
        run: pylint . --msg-template="::error file={path},line={line},col={column},title={category}::({symbol}) {msg}"
      - name: Run MyPy
        run: mypy .
      - name: Run isort
        uses: isort/isort-action@v1
      - name: Build docs
        working-directory: docs
        run: |
          pip3 install -r ../requirements.txt
          sphinx-build --fail-on-warning --builder html --doctree-dir build/doctrees --jobs auto --nitpicky .  build/html
  test:
    name: Test
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: ["ubuntu-24.04", "windows-2022", "macos-14"]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Clone the repository
        uses: actions/checkout@v4
      - name: Set up Python ${{matrix.python-version}}
        uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
      - name: Run tests and generate coverage
        run: pytest --cov=. --cov-report=lcov
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          flag-name: "${{matrix.os}} Python ${{matrix.python-version}}"
